<style>
:root{--bg:#080B12;--bg2:#111827;--a:#00F5D4;--b:#7C5CFF;--tx:#F8FAFC;--mu:#94A3B8;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.sg{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}
a{color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:center}
.nv{display:flex;gap:4px;align-items:center;background:rgba(17,24,39,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:999px;padding:6px;max-width:100%;overflow-x:auto}
.nv a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--mu);font-size:14px;white-space:nowrap}
.nv a:hover{color:var(--tx);background:var(--gl)}
.nv button{margin-left:4px}
.btn{display:inline-block;border:1px solid var(--bd);background:var(--gl);color:var(--tx);padding:11px 20px;border-radius:12px;font:500 15px Inter,sans-serif;text-decoration:none;cursor:pointer;transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--a)}
.btn.p{background:linear-gradient(135deg,var(--a),var(--b));color:#06121a;border:0;font-weight:500}
.sm{padding:6px 14px;font-size:14px;border-radius:999px}
section{padding:96px 24px;max-width:1080px;margin:0 auto}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:110px}
.hw{display:flex;align-items:center;justify-content:space-between;gap:48px}
.hero .in{max-width:620px}
.tag{color:var(--a);font:500 15px "Space Grotesk",sans-serif;margin:0 0 14px}
h1{font-size:clamp(36px,6.4vw,68px);line-height:1.05;margin:0 0 20px;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:18px;max-width:520px;margin:0 0 28px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.mot{margin-top:36px;color:var(--mu);font-style:italic}
h2{font-size:clamp(28px,4vw,42px);margin:0 0 28px;letter-spacing:-.01em}
.gl{background:var(--gl);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.gl.pad{padding:26px}
p{margin:0 0 14px}
.mu{color:var(--mu)}
.gl.pad{transition:border-color .25s,box-shadow .25s}
section:not(#contact) .gl.pad:hover{border-color:var(--a);box-shadow:0 18px 50px -18px rgba(0,245,212,.45)}
.js .rv{opacity:0;transform:translateY(34px) scale(.98);transition:opacity .75s ease,transform .75s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s}
.js .rv.in{opacity:1;transform:none}
.tl li.rv{transform:translateX(-22px)}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,245,212,.45)}50%{box-shadow:0 0 0 12px rgba(0,245,212,0)}}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.sk h3{margin:0 0 12px;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--bd);color:var(--tx)}
.chip.l{border-color:rgba(0,245,212,.45)}
.chip.e{border-color:rgba(124,92,255,.6);color:var(--mu)}
.lg{color:var(--mu);font-size:14px;margin-top:18px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 6px 0 14px;border:1px solid}
.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;perspective:1000px}
.card{padding:24px;transform-style:preserve-3d;transition:transform .15s ease-out,border-color .25s,box-shadow .25s;will-change:transform}
.card:hover{border-color:var(--a);box-shadow:0 18px 50px -18px rgba(0,245,212,.45)}

.card dt{display:inline;color:var(--tx)}
.card dd{display:inline;margin:0}

.card .lk{font-size:14px;color:var(--a);text-decoration:none}
.tl{border-left:2px solid var(--b);padding-left:22px}
.tl li{margin-bottom:8px;color:var(--mu)}
ul{padding-left:18px;margin:0}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.cta{text-align:center}
.cta h2{max-width:640px;margin:0 auto 14px}
form{display:grid;gap:12px;text-align:left;margin-top:24px}
label{font-size:14px;color:var(--mu)}
input,textarea{width:100%;background:rgba(8,11,18,.7);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font:16px Inter,sans-serif;padding:11px 13px;margin-top:4px}
.cl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.note{font-size:13px;color:var(--mu);margin-top:10px}
footer{text-align:center;color:var(--mu);padding:40px 24px calc(40px + 70px);border-top:1px solid var(--bd);font-size:14px}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;border:0;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));color:#06121a;font:700 15px "Space Grotesk",sans-serif;box-shadow:0 10px 30px -8px rgba(0,245,212,.6)}
#chat{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;width:min(380px,calc(100vw - 36px));height:min(540px,calc(100svh - 160px));display:none;flex-direction:column;background:rgba(13,18,30,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px -20px #000}
#chat.on{display:flex;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.ch{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.ch b{font-family:"Space Grotesk",sans-serif}
.ch small{display:block;color:var(--mu);font-size:12px}
.ch button{background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer;line-height:1}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;white-space:pre-line}
.m.b{background:var(--gl);border:1px solid var(--bd);align-self:flex-start}
.m.u{background:linear-gradient(135deg,rgba(0,245,212,.25),rgba(124,92,255,.35));align-self:flex-end}
.m a{color:var(--a)}
#qs{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
#qs button{font:13px Inter,sans-serif;color:var(--tx);background:var(--gl);border:1px solid var(--bd);border-radius:999px;padding:4px 11px;cursor:pointer}
#qs button:hover{border-color:var(--a)}
#cf{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
#cf input{margin:0}
#cf button{flex:none}
@media(max-width:760px){.hw{flex-direction:column-reverse;align-items:flex-start;gap:28px}.two{grid-template-columns:1fr}section{padding:72px 20px}.nv a.h{display:none}}
@media(prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none}html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>

 if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")});return}
 var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}})},{threshold:.15});
 els.forEach(function(e){io.observe(e)})})();
$("fab").textContent=D.buttons.nexus;$("cname").textContent=D.chat.name;$("cbadge").textContent=D.chat.badge;

/* Particle background */
(function(){
 try{
  var cv=document.getElementById("bg"),R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,1.75));
  var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(50,1,.1,100);C.position.z=6;
  var n=600,p=new Float32Array(n*3);for(var k=0;k<n*3;k++)p[k]=(Math.random()-.5)*20;
  var pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(p,3));
  var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x7C5CFF,size:.03,transparent:true,opacity:.75}));S.add(pts);
  var mx=0,my=0;
  addEventListener("pointermove",function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  function rs(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
  rs();addEventListener("resize",function(){rs();if(RM)R.render(S,C)});
  var t=0;
  function f(){t+=.002;pts.rotation.y=t+mx*.3;pts.rotation.x=my*.2;R.render(S,C);requestAnimationFrame(f)}
  if(RM)R.render(S,C);else f();
 }catch(e){document.getElementById("bg").style.display="none"}
})();

/* Card tilt */
document.querySelectorAll(".card").forEach(function(c){
 if(RM)return;
 c.addEventListener("pointermove",function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  c.style.transform="rotateY("+x*12+"deg) rotateX("+-y*12+"deg) translateZ(8px)"});
 c.addEventListener("pointerleave",function(){c.style.transform=""});
});

/* NEXUS */
var chat=document.getElementById("chat"),M=document.getElementById("msgs"),Q=document.getElementById("qs"),CI=document.getElementById("ci"),flow=null,lead={},greeted=false;
function open_(v){chat.classList.toggle("on",v);document.getElementById("fab").setAttribute("aria-expanded",v);
 if(v){if(!greeted){greeted=true;say(D.chat.intro);chips(D.chat.chips)}CI.focus()}}
document.querySelectorAll("[data-open]").forEach(function(b){b.addEventListener("click",function(){open_(!chat.classList.contains("on"))})});
document.getElementById("x").onclick=function(){open_(false)};
addEventListener("keydown",function(e){if(e.key==="Escape")open_(false)});
function say(t,u){var d=document.createElement("div");d.className="m "+(u?"u":"b");if(!u&&/<a /.test(t))d.innerHTML=t;else d.textContent=t;M.appendChild(d);M.scrollTop=M.scrollHeight}
function chips(a){Q.innerHTML="";a.forEach(function(s){var b=document.createElement("button");b.type="button";b.textContent=s;b.onclick=function(){ask(s)};Q.appendChild(b)})}
var KB=D.faq;
function ask(t){
 say(t,true);Q.innerHTML="";
 setTimeout(function(){reply(t)},RM?0:350);
}
function reply(t){
 var l=t.toLowerCase();
 if(flow){
  if(/cancel|stop|never ?mind/.test(l)){flow=null;lead={};say("No problem, nothing was saved. Anything else?");return}
  if(flow==="n"){lead.n=t.trim();flow="e";say("Thanks, "+lead.n+". What email should Mithlesh reply to?");return}
  if(flow==="e"){if(!/^\S+@\S+\.\S+$/.test(t.trim())){say("That doesn’t look like an email address. Try name@example.com, or say “cancel”.");return}
   lead.e=t.trim();flow="m";say("Last step: describe your project or idea in a sentence or two.");return}
  if(flow==="m"){lead.m=t.trim();flow=null;
   var href="mailto:"+EMAIL+"?subject="+encodeURIComponent("Project inquiry from "+lead.n)+"&body="+encodeURIComponent(lead.m+"\n\nFrom: "+lead.n+" ("+lead.e+")");
   say("Got it. Nothing is stored here, so tap the link to send it by email:\n<a href=\""+href+"\">Send inquiry to Mithlesh</a>");lead={};chips(["Services","Show projects"]);return}
 }
 if(/hire|inquir|work with|collaborat|project idea|get started|let.?s work|proposal/.test(l)){
  flow="n";say("Great. I’ll collect just what’s needed for an inquiry: name, email, and a short description. Say “cancel” anytime. First, what’s your name?");return}
 if(AI){askAI(t);return}
 for(var i=0;i<KB.length;i++)if(KB[i][0].test(l)){say(KB[i][1]);chips(["Show projects","Services","Hire him"]);return}
 say(D.chat.fallback);chips(["Who is Mithlesh?","Show projects","Services","Hire him"]);
}
document.getElementById("cf").addEventListener("submit",function(e){e.preventDefault();var v=CI.value.trim();if(!v)return;CI.value="";ask(v)});

/* ---------- NEXUS live AI (Claude). Falls back to the D.faq answers if unavailable ---------- */
var AI=null,hist=[],busy=false;
if(window.claude&&claude.use)claude.use("sample").then(function(x){if(x){AI=x;$("cbadge").textContent=D.chat.badge+" · powered by Claude"}}).catch(function(){});
function SYS(){
 var k={name:D.name,title:D.title,headline:D.headline,about:D.about,skills:D.skills.groups,
  projects:D.projects.items.map(function(p){return{title:p.title,status:p.status,description:p.desc,role:p.role,tools:p.tools,link:U(p.link)}}),
  experience:D.experience,education:D.education,services:D.services,resumeLink:U(D.resume.link),
  contactEmail:/example\.com$/.test(D.contact.email)?"":D.contact.email,
  socials:D.contact.socials.filter(function(s){return U(s.url)})};
 return "You are "+D.chat.name+", the AI assistant on "+D.name+"'s portfolio website. You are an AI, not "+D.name+". Answer visitors using ONLY the facts below. Rules: be friendly, professional and concise (under 90 words, plain text, no markdown). Never invent experience, clients, completed projects, qualifications or links. Never promise availability, deadlines or prices; say rates depend on scope and the visitor should send an inquiry. Never claim any site or app is secure without testing. Share only contact details listed below; if none, point to the contact form on the page. If asked something not covered, say you don't know and suggest contacting "+D.name+". If a visitor wants to hire or start a project, invite them to say 'hire him' so you can collect a short inquiry.\n\nFACTS:\n"+JSON.stringify(k);
}
function kb(t){var l=t.toLowerCase();for(var i=0;i<KB.length;i++)if(KB[i][0].test(l)){say(KB[i][1]);chips(["Show projects","Services","Hire him"]);return}say(D.chat.fallback);chips(D.chat.chips)}
function askAI(t){
 if(busy)return;busy=true;hist.push({role:"user",content:t});
 var d=document.createElement("div");d.className="m b";d.textContent="…";M.appendChild(d);M.scrollTop=M.scrollHeight;
 var m=hist.slice(-7).map(function(x){return{role:x.role,content:x.content}});
 m[0].content=SYS()+"\n\nConversation follows. Visitor: "+m[0].content;
 AI(m,{cache:false,onText:function(r){d.textContent=r.text;M.scrollTop=M.scrollHeight}}).then(function(r){
  var x=(r&&r.text)||"";d.textContent=x||D.chat.fallback;hist.push({role:"assistant",content:d.textContent});busy=false;chips(["Show projects","Services","Hire him"]);
 }).catch(function(e){busy=false;d.remove();hist.pop();if(e&&e.code==="not_granted")AI=null;kb(t)});
}
