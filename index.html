<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mithlesh | AI Engineer</title>
<meta name="description" content="AI Engineer building LLM applications, machine learning systems and the software around them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* TODO: clean up these root variables later if dark mode breaks */
:root{
  --bg-color:#F4F5FA; --surface:#FFFFFF; --ink-main:#161A2E; --muted:#5A6079; --line:#DDE0EE;
  --accent-primary:#5B4BFF; --accent-ink:#FFFFFF; --signal:#C77700; --code-bg:#EEF0FA;
  --display:"Bricolage Grotesque",Georgia,serif; --body-font:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-color:#101528; --surface:#171D36; --ink-main:#ECEEF8; --muted:#9AA1C2; --line:#2A3158;
    --accent-primary:#8B7CFF; --accent-ink:#101528; --signal:#FFB84D; --code-bg:#0C1020;
  }
}
:root[data-theme="dark"]{
  --bg-color:#101528; --surface:#171D36; --ink-main:#ECEEF8; --muted:#9AA1C2; --line:#2A3158;
  --accent-primary:#8B7CFF; --accent-ink:#101528; --signal:#FFB84D; --code-bg:#0C1020;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg-color);color:var(--ink-main);font:400 1.0625rem/1.65 var(--body-font);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent-primary);outline-offset:3px;border-radius:4px}
.wrap{width:min(1080px,100% - 2.5rem);margin-inline:auto}
h1,h2,h3{font-family:var(--display);line-height:1.08;letter-spacing:-.02em}
h2{font-size:clamp(1.9rem,4vw,2.6rem);margin-bottom:2rem}
section{padding:5rem 0}
.mono{font-family:var(--mono);font-size:.85rem}

/* contact - moved up here randomly because I was working on it last */
.contact{text-align:center;border-top:1px solid var(--line)}
.contact h2{margin-bottom:1rem}

header{position:sticky;top:0;z-index:10;background:rgba(244, 245, 250, 0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:700 1.15rem var(--display);text-decoration:none}
.links{display:flex;gap:1.6rem;align-items:center}
.links a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
.links a:hover{color:var(--ink-main)}
.theme{background:none;border:1px solid var(--line);color:var(--ink-main);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1rem}  
@media(max-width:720px){.links a{display:none}}

.hero{padding:4.5rem 0 5rem;display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.6rem);margin-bottom:1.25rem}
.hero p.lead{color:var(--muted);max-width:34rem;font-size:1.15rem}  
.cta{display:flex;gap:.9rem;margin-top:2rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line);transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent-primary);color:var(--accent-ink);border-color:var(--accent-primary)}
.term{background:var(--code-bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px -25px rgba(30,30,90,.45)}
.term-bar{display:flex;gap:6px;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.term-bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.term-body{padding:1.2rem 1.3rem 1.5rem;min-height:292px;font-family:var(--mono);font-size:.84rem;line-height:1.75}
.term .q{color:var(--muted)} .term .q b{color:var(--signal);font-weight:500}
.term .a{margin-top:.9rem;white-space:pre-wrap}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--accent-primary);vertical-align:-.18em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media(max-width:860px){.hero{grid-template-columns:1fr}}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2rem}
.card{grid-column:span 3;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.6rem;display:flex;flex-direction:column;gap:.8rem}
.card.feature{grid-column:span 6;display:grid;grid-template-columns:1fr 1fr;gap:2rem;padding:2rem}
.card h3{font-size:1.4rem}
.card p{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto}
.tags span{font:500 .78rem var(--mono);padding:.2rem .6rem;border-radius:6px;background:var(--code-bg);border:1px solid var(--line);color:var(--muted)}
.card a.more{font-weight:600;text-decoration:none;color:var(--accent-primary)}
.card a.more:hover{text-decoration:underline}
.metric{display:flex;flex-direction:column;justify-content:center;gap:.4rem;border-left:1px solid var(--line);padding-left:2rem}
.metric strong{font:700 2.6rem var(--display);color:var(--accent-primary)}
@media(max-width:760px){.card,.card.feature{grid-column:span 6}.card.feature{grid-template-columns:1fr;gap:1rem}.metric{border:0;padding:0}}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2rem 1.5rem}
.skills h3{font-size:1.05rem;margin-bottom:.7rem;font-family:var(--body-font);font-weight:600;letter-spacing:0}
.skills ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:.45rem}
.skills li{padding:.3rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.92rem}

.tl{border-left:2px solid var(--line);margin-left:.4rem}
.tl article{position:relative;padding:0 0 2.2rem 1.8rem}
.tl article::before{content:"";position:absolute;left:-7px;top:.5rem;width:12px;height:12px;border-radius:50%;background:var(--accent-primary);border:2px solid var(--bg-color)}
.tl h3{font-size:1.25rem}
.tl .when{color:var(--muted);margin:.15rem 0 .5rem}
.tl p{max-width:44rem}

.two{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.two ul{padding-left:1.1rem;color:var(--muted)} .two li{margin-bottom:.5rem} .two li b{color:var(--ink-main);font-weight:600}
@media(max-width:760px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- everything looks fine, don't touch layout structure -->
</body>
</html>
